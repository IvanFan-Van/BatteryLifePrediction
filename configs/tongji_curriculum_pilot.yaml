experiment:
    project: battery-life-prediction
    group: tongji-attention-single-cell
    name: tongji-observation-curriculum-pilot
seed: 42
data:
    root: data/processed/tongji_v1
    train_cell: Tongji1_CY25-025_1--4
    test_cell: Tongji1_CY25-025_1--5
    batch_size: 2
    num_workers: 0
    val_ratio: 0.2
    split_seed: 2026
    eval_seed: 2027
    horizon: 4
    max_anchor_cycle: 6
model:
    d_model: 32
    state_dim: 16
    feature_dim: 4
    scalar_hidden: 8
    time_dim: 8
    heads: 2
    feedforward_dim: 64
    point_layers: 1
    cycle_layers: 2
    dropout: 0.0
    context_dim: 16
    dynamics_hidden: 64
    head_hidden: 32
    time_scale_s: 10000.0
    cycle_scale: 100.0
    transition_scale: 0.1
    initial_soh_bias: 0.9
    static_fusion: cycle
optimizer:
    lr: 0.003
    weight_decay: 0.0001
trainer:
    accelerator: cpu
    cpu_threads: 4
    max_epochs: 2
    limit_train_batches: 2
    limit_val_batches: 1
    limit_test_batches: 2
    gradient_clip_val: 1.0
    evaluation_batches: 2
observation_schedule:
    - start_epoch: 0
      cycle_fraction: 100%
      segment_fraction: 100%
      value_keep: 100%
    - start_epoch: 1
      cycle_fraction: 50%
      segment_fraction: 50%
      value_keep: 90%
