experiment:
    project: battery-life-prediction
    group: tongji-attention-single-cell
    name: tongji-observation-curriculum-pilot
seed: 42
data:
    batch_size: 2
    num_workers: 0
    val_task_fraction: 0.2
    split_seed: 2026
    eval_seed: 2027
    root: data/processed/tongji_v1
    cell_ids:
        train: [Tongji1_CY25-025_1--4]
        test: [Tongji1_CY25-025_1--5]
    forecast_horizon_cycles: 4
    max_cycle_position: 6
    samples_per_task: 1
    max_epochs: 2
    observation_schedule:
        - start_epoch: 0
          cycle_fraction: 1.0
          segment_fraction: 1.0
          value_keep: 1.0
        - start_epoch: 1
          cycle_fraction: 0.5
          segment_fraction: 0.5
          value_keep: 0.9
model:
    d_model: 32
    state_dim: 16
    feature_dim: 4
    scalar_hidden: 8
    time_dim: 8
    heads: 2
    feedforward_dim: 64
    point_layers: 1
    cycle_layers: 2
    dropout: 0.0
    context_dim: 16
    dynamics_hidden: 64
    head_hidden: 32
    time_scale_s: 10000.0
    cycle_scale: 100.0
    transition_scale: 0.1
    initial_soh_bias: 0.9
    static_fusion: cycle
optimizer:
    lr: 0.003
    weight_decay: 0.0001
trainer:
    accelerator: cpu
    cpu_threads: 4
    limit_train_batches: 2
    limit_val_batches: 1
    limit_test_batches: 2
    gradient_clip_val: 1.0
    evaluation_batches: 2
