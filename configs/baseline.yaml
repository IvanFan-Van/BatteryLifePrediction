experiment:
    project: battery-life-prediction
    group: tongji-attention-single-cell
    name: tongji-observation-curriculum-pilot
seed: 42

data:
    # 数据加载与切分的通用参数。
    batch_size: 8
    num_workers: 0
    val_task_fraction: 0.2
    split_seed: 2026
    eval_seed: 2027

    # TongjiTaskDataset 的参数。
    root: data/processed/tongji_v1
    cell_ids:
        train: [Tongji1_CY25-025_1--4]
        test: [Tongji1_CY25-025_1--5]
    forecast_horizon_cycles: 10 # 每个任务预测的 SOH 轮数。
    max_cycle_position: 50 # 按每个电芯的循环记录位置计数。null 表示没有上限。
    samples_per_task: 10
    max_epochs: 1 # 同时用于日程和 Trainer。

    # 运行时观测规则，epoch 从 0 开始。
    observation_schedule:
        - start_epoch: 0
          cycle_fraction: 1.0
          segment_fraction: 1.0
          value_keep: 1.0

model:
    embedding:
        scalar:
            output_dim: 8
            hidden_dim: 16
            activation: gelu
        categorical:
            output_dim: 8
        time_scale_s: 10000.0
        cycle_distance_scale: 100.0
    state_estimator:
        d_model: 16
        state_dim: 16
        num_heads: 2
        feedforward_dim: 64
        field_layers: 2
        time_layers: 2
        cycle_layers: 2
        dropout: 0.0
    dynamics:
        hidden_dims: [64, 64]
        activation: gelu
    soh_head:
        hidden_dims: [32, 16]
        activation: gelu

optimizer:
    lr: 0.003
    weight_decay: 0.0001

trainer:
    accelerator: gpu
    cpu_threads: 16
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    limit_test_batches: 1.0
    gradient_clip_val: 1.0
    evaluation_batches: 8
