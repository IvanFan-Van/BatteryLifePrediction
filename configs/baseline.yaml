experiment:
    project: cifar10-architecture-study
    group: baseline
    name: resnet18-sgd-cosine

seed: 45

data:
    root: ./data
    batch_size: 128
    num_workers: 0
    val_ratio: 0.1
    split_seed: 2026

model:
    name: resnet18
    num_classes: 10

optimizer:
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005

trainer:
    max_epochs: 30
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    log_every_n_steps: 50
