[project]
name = "battery-life-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightning>=2.6.6",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "tensorboard>=2.21.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tyro>=1.0.16",
    "wandb>=0.31.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
